# Freno a la IA: el servidor es chico y Ollama atiende de a una; sin esto un solo
# script deja a todos esperando (cada respuesta tarda unos segundos)
limit_req_zone $binary_remote_addr zone=ia:1m rate=12r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Detrás de Cloudflare Tunnel (o en Docker Desktop) todos llegan desde la red de
    # Docker: se toma la IP real que manda Cloudflare. Solo se le cree a esa red,
    # así en un servidor Linux un alumno de la LAN no puede inventarse otra IP.
    # shortcut: en Docker Desktop (Windows) la LAN también entra por 172.x y sí podría, solo para demos
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        # IP real del alumno para el límite de consultas por código
        proxy_set_header X-Real-IP $remote_addr;
        # el LLM local puede tardar en redactar
        proxy_read_timeout 300s;
    }

    location ~ ^/api/(chat|ia/) {
        limit_req zone=ia burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
